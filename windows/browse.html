<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'">
<title>Browse Spotify</title>
<style>
  :root { --spring: cubic-bezier(.3, 1.35, .5, 1); --out: cubic-bezier(.2, .8, .2, 1); --accent: #8b6cff; }
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; color: #f2f3f7;
    font: 14px/1.4 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; user-select: none; }
  .panel { position: absolute; inset: 10px; display: flex; flex-direction: column; border-radius: 24px; overflow: hidden;
    background: rgba(16, 16, 24, .72); backdrop-filter: blur(28px) saturate(1.5);
    box-shadow: 0 0 0 1px rgba(255,255,255,.09) inset, 0 24px 70px rgba(0,0,0,.55);
    animation: in 420ms var(--spring) both; }
  @keyframes in { from { opacity: 0; transform: translateY(14px) scale(.97); } }
  .top { display: flex; align-items: center; gap: 12px; padding: 18px 20px 14px; }
  .top svg { width: 20px; height: 20px; fill: #1ed760; flex: none; }
  input { flex: 1; font: 500 19px "Segoe UI Variable Display", "Segoe UI", sans-serif; color: #fff; background: none; border: 0; outline: 0; }
  input::placeholder { color: rgba(255,255,255,.38); }
  .status { font-size: 12.5px; color: rgba(255,255,255,.5); white-space: nowrap; }
  .list { flex: 1; overflow-y: auto; padding: 4px 10px 10px; scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.2) transparent; }
  h3 { margin: 14px 12px 6px; font-size: 11.5px; letter-spacing: .12em; text-transform: uppercase; color: rgba(255,255,255,.45); font-weight: 600; }
  .item { display: flex; align-items: center; gap: 12px; padding: 9px 12px; border-radius: 12px; cursor: pointer;
    transition: background 140ms var(--out), transform 260ms var(--spring); animation: row 360ms var(--out) backwards; animation-delay: calc(var(--i) * 16ms); }
  @keyframes row { from { opacity: 0; transform: translateY(6px); } }
  .item:hover { background: rgba(255,255,255,.06); }
  .item.sel { background: rgba(139,108,255,.22); box-shadow: inset 0 0 0 1px rgba(139,108,255,.45); }
  .item:active { transform: scale(.985); }
  .dot { width: 34px; height: 34px; border-radius: 9px; flex: none; display: grid; place-items: center; background: rgba(255,255,255,.07); }
  .dot svg { width: 14px; height: 14px; fill: rgba(255,255,255,.75); }
  .item.sel .dot { background: var(--accent); } .item.sel .dot svg { fill: #fff; }
  .t { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .s { font-size: 12.5px; color: rgba(255,255,255,.55); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .txt { min-width: 0; }
  .empty { padding: 40px 20px; text-align: center; color: rgba(255,255,255,.5); }
  .shimmer { height: 46px; margin: 6px 2px; border-radius: 12px; background: linear-gradient(90deg, rgba(255,255,255,.04), rgba(255,255,255,.1), rgba(255,255,255,.04));
    background-size: 200% 100%; animation: sh 1.1s linear infinite; }
  @keyframes sh { to { background-position: -200% 0; } }
  .foot { display: flex; gap: 16px; justify-content: center; padding: 11px; font-size: 12px; color: rgba(255,255,255,.5); border-top: 1px solid rgba(255,255,255,.07); }
  kbd { font: 600 11px "Bahnschrift", sans-serif; padding: 2px 6px; border-radius: 5px; background: rgba(255,255,255,.1); color: #fff; margin-right: 4px; }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div class="panel">
  <div class="top">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm4.6 14.4a.6.6 0 0 1-.9.2c-2.4-1.5-5.4-1.8-9-1a.6.6 0 1 1-.3-1.2c3.9-.9 7.2-.5 9.9 1.1.3.2.4.6.3.9zm1.2-2.7a.8.8 0 0 1-1 .3c-2.7-1.7-6.9-2.2-10.2-1.2a.8.8 0 0 1-.4-1.5c3.7-1.1 8.4-.6 11.4 1.3.4.2.5.7.2 1.1zm.1-2.8C14.7 9 9.4 8.8 6.3 9.7a.9.9 0 1 1-.5-1.8c3.5-1.1 9.4-.9 13.1 1.3a.9.9 0 0 1-1 1.7z"/></svg>
    <input id="q" placeholder="Search Spotify (songs, artists, playlists)" aria-label="Search Spotify" spellcheck="false" autofocus>
    <span class="status" id="status"></span>
  </div>
  <div class="list" id="list" role="listbox"></div>
  <div class="foot"><span><kbd>↑</kbd><kbd>↓</kbd>choose</span><span><kbd>Enter</kbd>search / play</span><span><kbd>Tab</kbd><kbd>Esc</kbd>close</span></div>
</div>
<script src="browse.js"></script>
</body>
</html>
