<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'">
<title>Bandwave</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; cursor: default; user-select: none;
    font-family: "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif; color: #fff; }
  body.drag { -webkit-app-region: drag; }
  body.drag button { -webkit-app-region: no-drag; }
  #bg { position: absolute; inset: -8%; background-size: cover; background-position: center; transition: opacity 900ms ease-out; }
  #stage { position: absolute; inset: 0; }
  #stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  #glow { mix-blend-mode: screen; }
  /* Spinning record: vinyl grooves + album-art label + song name around the groove; lyrics float on top (not spinning). */
  #rec { position: absolute; border-radius: 50%; opacity: 0; transition: opacity 700ms ease-out; pointer-events: none; will-change: transform; }
  #rec.on { opacity: 1; }
  #spin { position: absolute; inset: 0; border-radius: 50%; will-change: transform; }
  .vinyl { position: absolute; inset: 0; border-radius: 50%;
    background: radial-gradient(circle, transparent 0 31%, rgba(0,0,0,.6) 31.5%, transparent 33%),
      repeating-radial-gradient(circle, #09090b 0 1px, #17171b 1.4px 2.3px, #0c0c0f 2.6px 3.2px), #0b0b0e;
    box-shadow: 0 0 0 1px rgba(255,255,255,.06), 0 30px 90px rgba(0,0,0,.7), 0 0 70px var(--recGlow, rgba(124,92,255,.35)); }
  #label { position: absolute; left: 50%; top: 50%; width: 38%; height: 38%; translate: -50% -50%; border-radius: 50%; object-fit: cover;
    box-shadow: 0 0 0 2px rgba(0,0,0,.6); transition: filter 900ms cubic-bezier(.2,.8,.2,1); }
  #rec.lyr #label { filter: blur(4px) brightness(.4) saturate(1.3); }
  .hole { position: absolute; left: 50%; top: 50%; width: 3%; height: 3%; translate: -50% -50%; border-radius: 50%; background: #050506; box-shadow: inset 0 0 0 1px rgba(255,255,255,.15); }
  #ring { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  #ring text { fill: rgba(255,255,255,.82); font: 600 4.3px "Bahnschrift", "Segoe UI", sans-serif; letter-spacing: .6px; text-transform: uppercase; }
  .sheen { position: absolute; inset: 0; border-radius: 50%; mix-blend-mode: screen; pointer-events: none;
    background: conic-gradient(from 25deg, transparent 0 8%, rgba(255,255,255,.13) 13%, transparent 20% 52%, rgba(255,255,255,.09) 60%, transparent 68%); }

  #lyr { position: absolute; left: 50%; top: 50%; width: 80%; height: 80%; translate: -50% -50%; border-radius: 50%; overflow: hidden;
    -webkit-mask-image: radial-gradient(circle, #000 52%, transparent 71%); opacity: 0; transition: opacity 600ms ease-out;
    background: radial-gradient(circle, rgba(0,0,0,.5) 0 38%, transparent 70%); }
  #rec.lyr #lyr { opacity: 1; }
  /* bottom-left lyrics panel (owner 2026-11-22): left-aligned, fades at top and bottom, sits above the now-playing card */
  #lyr.bl { position: absolute; left: 3.2vw; top: auto; bottom: calc(5.5vh + 128px); translate: none; width: min(40vw, 760px); height: 34vh;
    border-radius: 0; background: none; -webkit-mask-image: linear-gradient(to bottom, transparent, #000 30%, #000 72%, transparent); }
  body.nocard #lyr.bl { bottom: 5.5vh; }
  body.lyr-on #lyr.bl { opacity: 1; }
  #lyr.bl #track { align-items: flex-start; }
  #lyr.bl .ln { max-width: 100%; text-align: left; transform-origin: left center; text-shadow: 0 2px 24px rgba(0,0,0,.55); }
  #track { position: absolute; left: 0; right: 0; top: 0; display: flex; flex-direction: column; align-items: center; gap: .55em;
    transition: transform 820ms cubic-bezier(.18,.9,.22,1.06); font-size: var(--fs, 20px); }
  .ln { max-width: 74%; text-align: center; line-height: 1.12; color: #fff; opacity: 0; filter: blur(6px); transform: scale(.78);
    transition: opacity 700ms cubic-bezier(.2,.8,.2,1), filter 700ms cubic-bezier(.2,.8,.2,1), transform 820ms cubic-bezier(.2,1.25,.4,1);
    font-family: "Bahnschrift", "Segoe UI Variable Display", sans-serif; font-variation-settings: "wght" 420, "wdth" 100; text-wrap: balance; }
  .ln.d1 { opacity: .42; filter: blur(1.4px); transform: scale(.8); }
  .ln.d2 { opacity: .14; filter: blur(3px); transform: scale(.72); }
  .ln.cur { opacity: 1; filter: none; transform: scale(calc(1 + var(--beat, 0) * .07));
    font-variation-settings: "wght" var(--wght, 520), "wdth" var(--wdth, 100); letter-spacing: var(--ls, 0); }
  .ln.chorus { text-transform: uppercase; letter-spacing: .03em; }
  .ln.loud { font-style: italic; }
  .ln.soft { font-family: Georgia, "Times New Roman", serif; font-style: italic; font-variation-settings: normal; }
  .ln.big { font-size: 1.28em; } .ln.long { font-size: .84em; }
  .ln.gap { font-size: 1.4em; letter-spacing: .3em; }
  .w { display: inline-block; white-space: pre; opacity: .38; transition: opacity 260ms ease-out, text-shadow 420ms ease-out, transform 420ms cubic-bezier(.3,1.6,.5,1); }
  .cur .w { animation: wIn 640ms cubic-bezier(.2,1.2,.35,1) both; animation-delay: calc(var(--i) * 38ms); }
  .w.lit { opacity: 1; text-shadow: 0 0 .5em var(--litGlow, rgba(180,150,255,.85)); transform: translateY(-.04em); }
  @keyframes wIn { from { opacity: 0; transform: translateY(.45em) scale(.85); filter: blur(8px); } }
  .gap .w { animation: breathe 1.6s ease-in-out infinite; animation-delay: calc(var(--i) * 200ms); opacity: .7; }
  @keyframes breathe { 50% { opacity: .2; transform: scale(.8); } }

  #card { position: absolute; display: flex; align-items: center; gap: 18px; padding: 14px 22px 14px 14px; border-radius: 22px;
    background: rgba(12, 12, 18, .38); backdrop-filter: blur(12px); box-shadow: 0 0 0 1px rgba(255,255,255,.07) inset;
    opacity: 0; transform: translateY(12px); transition: opacity 600ms cubic-bezier(.2,.8,.2,1), transform 600ms cubic-bezier(.2,.8,.2,1); max-width: 40vw; }
  #card.on { opacity: 1; transform: none; }
  #card.bottom-left { left: 3.2vw; bottom: 5.5vh; }
  #card.bottom-center { left: 50%; bottom: 5.5vh; translate: -50% 0; }
  #card.top-left { left: 3.2vw; top: 5vh; }
  #card img { width: 74px; height: 74px; border-radius: 14px; object-fit: cover; box-shadow: 0 8px 26px rgba(0,0,0,.45); }
  #card .t { font-size: 20px; font-weight: 600; letter-spacing: -.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #card .a { font-size: 15px; opacity: .7; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #card .ctl { display: flex; gap: 4px; margin-top: 8px; }
  #card button { all: unset; width: 34px; height: 34px; display: grid; place-items: center; border-radius: 50%; cursor: pointer;
    transition: background 160ms ease-out, transform 220ms cubic-bezier(.3,1.5,.5,1); }
  #card button:hover { background: rgba(255,255,255,.12); }
  #card button:active { transform: scale(.9); }
  #card svg { width: 18px; height: 18px; fill: #fff; }
  #card .meta { min-width: 0; }
  body.fs #card { left: 50%; bottom: 7vh; top: auto; translate: -50% 0; padding: 18px 30px 18px 18px; }
  body.fs #card img { width: 110px; height: 110px; }
  body.fs #card .t { font-size: 28px; }
  body.fs #card .a { font-size: 19px; }

  #clock { position: absolute; top: 4.5vh; right: 3.4vw; text-align: right; opacity: 0; transition: opacity 600ms ease-out;
    text-shadow: 0 2px 30px rgba(0,0,0,.4); font-variant-numeric: tabular-nums; }
  #clock.on { opacity: .92; }
  #clock .h { font-size: clamp(48px, 6.2vw, 120px); font-weight: 200; letter-spacing: -.03em; line-height: 1; }
  #clock .d { font-size: clamp(14px, 1.1vw, 22px); opacity: .7; margin-top: 6px; letter-spacing: .04em; }
  #keys { position: absolute; right: 3.4vw; top: calc(4.5vh + clamp(48px, 6.2vw, 120px) + 64px); display: grid; grid-template-columns: auto auto;
    gap: 7px 14px; align-items: center; justify-items: end; font-size: clamp(12px, .78vw, 15px); color: #fff; opacity: .34;
    transition: opacity 500ms ease-out; text-shadow: 0 1px 12px rgba(0,0,0,.5); pointer-events: none; }
  #keys.flash { opacity: .85; transition-duration: 120ms; }
  #keys.off { display: none; }
  #keys kbd { font: 600 .86em "Bahnschrift", "Segoe UI", sans-serif; padding: 3px 8px; border-radius: 7px; background: rgba(255,255,255,.1);
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.18); letter-spacing: .02em; white-space: nowrap; }
  #keys span { justify-self: start; opacity: .85; }
  #hint { position: absolute; top: 20px; left: 50%; translate: -50% 0; font-size: 13px; opacity: 0; transition: opacity 400ms; background: rgba(0,0,0,.4); padding: 6px 12px; border-radius: 99px; }
  body.fs #hint { opacity: .55; animation: hide 0s 4s forwards; }
  @keyframes hide { to { opacity: 0; } }
</style>
</head>
<body>
  <div id="bg"></div>
  <div id="stage"><canvas id="viz"></canvas><canvas id="glow"></canvas></div>
  <div id="rec">
    <div id="spin">
      <div class="vinyl"></div>
      <img id="label" alt="">
      <div class="hole"></div>
      <svg id="ring" viewBox="0 0 100 100"><defs><path id="circ" d="M50,50 m-42,0 a42,42 0 1,1 84,0 a42,42 0 1,1 -84,0"/></defs>
        <text><textPath id="ringText" href="#circ" textLength="263.9" lengthAdjust="spacing"></textPath></text></svg>
    </div>
    <div class="sheen"></div>
    <div id="lyr"><div id="track"></div></div>
  </div>
  <div id="card">
    <img id="cover" alt="">
    <div class="meta">
      <div class="t" id="title"></div>
      <div class="a" id="artist"></div>
      <div class="ctl">
        <button id="prev" title="Previous" aria-label="Previous"><svg viewBox="0 0 24 24"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg></button>
        <button id="pp" title="Play / pause" aria-label="Play or pause"><svg viewBox="0 0 24 24"><path id="ppIcon" d="M7 5v14l12-7z"/></svg></button>
        <button id="next" title="Next" aria-label="Next"><svg viewBox="0 0 24 24"><path d="M16 5h2v14h-2zM4 5v14l11-7z"/></svg></button>
      </div>
    </div>
  </div>
  <div id="clock"><div class="h" id="clockH"></div><div class="d" id="clockD"></div></div>
  <div id="keys" aria-hidden="true"></div>
  <div id="hint">Space play / pause · ← → skip · ` settings · Esc window</div>
  <script src="viz.js"></script>
</body>
</html>
