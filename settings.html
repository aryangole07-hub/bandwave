<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'">
<title>Bandwave</title>
<style>
  :root { --bg: #0d0e12; --panel: #15171d; --line: #252833; --text: #eceef3; --dim: #8b90a0; --accent: #8b6cff;
    --spring: cubic-bezier(.3, 1.35, .5, 1); --out: cubic-bezier(.2, .8, .2, 1); }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; }
  header { position: sticky; top: 0; z-index: 2; display: flex; align-items: center; gap: 18px; padding: 18px 28px;
    background: rgba(13,14,18,.86); backdrop-filter: blur(16px); border-bottom: 1px solid var(--line); }
  h1 { margin: 0; font: 600 20px/1 "Segoe UI Variable Display", "Segoe UI", sans-serif; letter-spacing: -.01em; }
  h1 span { color: var(--accent); }
  .now { display: flex; align-items: center; gap: 10px; min-width: 0; color: var(--dim); margin-left: 8px; }
  .now img { width: 34px; height: 34px; border-radius: 8px; object-fit: cover; }
  .now b { color: var(--text); font-weight: 600; }
  .now .txt { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 32vw; }
  .grow { flex: 1; }
  button { font: inherit; color: var(--text); background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 8px 14px; cursor: pointer;
    transition: border-color 160ms var(--out), background 160ms var(--out), transform 260ms var(--spring); }
  button:hover { border-color: #3a3f4d; background: #1a1d25; }
  button:active { transform: scale(.96); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  main { padding: 22px 28px 60px; display: grid; gap: 18px; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); align-items: start; }
  .profiles { grid-column: 1 / -1; display: grid; gap: 12px; }
  .pbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  .pbar input { width: auto; flex: 1 1 200px; padding: 9px 12px; border-radius: 11px; }
  .pbar input[type=search] { flex: 1 1 240px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; min-height: 42px; }
  .chip { display: inline-flex; align-items: center; gap: 8px; padding: 9px 10px 9px 15px; border-radius: 12px; animation: pop 380ms var(--spring) both; }
  .chip small { color: var(--dim); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; }
  .chip .x { all: unset; width: 20px; height: 20px; display: grid; place-items: center; border-radius: 6px; color: var(--dim); cursor: pointer; }
  .chip .x:hover { background: #2a2e39; color: var(--text); }
  .chip.mine { border-color: color-mix(in oklab, var(--accent) 45%, var(--line)); }
  .empty { color: var(--dim); padding: 10px 2px; }
  .toast { position: fixed; bottom: 22px; left: 50%; translate: -50% 0; background: #1d2028; border: 1px solid var(--line); padding: 10px 16px; border-radius: 12px;
    opacity: 0; transform: translateY(8px); transition: opacity 240ms var(--out), transform 380ms var(--spring); pointer-events: none; }
  .toast.on { opacity: 1; transform: none; }
  @keyframes pop { from { opacity: 0; transform: scale(.92); } }
  section { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 18px 18px 8px; animation: rise 520ms var(--out) both; }
  section:nth-child(3) { animation-delay: 40ms; } section:nth-child(4) { animation-delay: 80ms; } section:nth-child(5) { animation-delay: 120ms; }
  section:nth-child(6) { animation-delay: 160ms; } section:nth-child(7) { animation-delay: 200ms; }
  @keyframes rise { from { opacity: 0; transform: translateY(10px); } }
  h2 { margin: 0 0 12px; font-size: 12px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--dim); }
  .row { display: grid; grid-template-columns: 128px 1fr 56px; align-items: center; gap: 12px; padding: 7px 0; }
  .row.wide { grid-template-columns: 128px 1fr; }
  label { color: #c6c9d4; }
  .val { text-align: right; color: var(--dim); font-variant-numeric: tabular-nums; font-size: 13px; }
  input[type=range] { width: 100%; accent-color: var(--accent); }
  select, input[type=text], input[type=number], input[type=search] { width: 100%; font: inherit; color: var(--text); background: #0f1116; border: 1px solid var(--line); border-radius: 9px; padding: 7px 9px; }
  input[type=color] { width: 44px; height: 30px; border: 1px solid var(--line); border-radius: 8px; background: none; padding: 2px; }
  .seg { display: flex; flex-wrap: wrap; gap: 6px; }
  .seg button { padding: 6px 11px; border-radius: 9px; font-size: 13px; }
  .seg button.on { background: color-mix(in oklab, var(--accent) 26%, var(--panel)); border-color: var(--accent); }
  .switch { position: relative; width: 40px; height: 22px; }
  .switch input { opacity: 0; position: absolute; inset: 0; margin: 0; cursor: pointer; z-index: 1; }
  .switch i { position: absolute; inset: 0; border-radius: 99px; background: #2a2e39; transition: background 200ms var(--out); }
  .switch i::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: transform 320ms var(--spring); }
  .switch input:checked + i { background: var(--accent); }
  .switch input:checked + i::after { transform: translateX(18px); }
  .hint { color: var(--dim); font-size: 12.5px; margin: -2px 0 8px; }
  .hidden { display: none; }
  footer { grid-column: 1 / -1; color: var(--dim); font-size: 12.5px; }
  kbd { font: 12px ui-monospace, Consolas, monospace; background: #1d2028; border: 1px solid var(--line); border-radius: 5px; padding: 1px 5px; }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<header>
  <h1>Band<span>wave</span></h1>
  <div class="now"><img id="ncov" alt="" hidden><div class="txt" id="ntxt">Nothing playing</div></div>
  <div class="grow"></div>
  <button id="fs">Full screen</button>
  <button id="reset">Reset</button>
</header>
<main id="main"></main>
<div class="toast" id="toast" role="status"></div>
<script src="settings.js"></script>
</body>
</html>
